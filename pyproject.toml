[tool.ruff]
target-version = "py311"
extend-exclude = ["coursework", "_local", "_to_delete"]

[tool.ruff.lint]
# E = style errors, F = real mistakes (like unused names), I = import order, B = likely bugs
select = ["E", "F", "I", "B"]
# E501 = "line too long"; ignored to avoid noise
ignore = ["E501"]
